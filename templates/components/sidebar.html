<aside class="navbar navbar-vertical navbar-expand-lg" data-bs-theme="light" aria-label="Navegación principal">
  <div class="container-fluid">
    <button
      class="navbar-toggler"
      type="button"
      data-bs-toggle="collapse"
      data-bs-target="#sidebar-menu"
      aria-controls="sidebar-menu"
      aria-expanded="false"
      aria-label="Abrir menú"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <h1 class="navbar-brand mb-0">
      <a href="{% url 'inicio' %}">Vita CRM</a>
    </h1>
    <div class="collapse navbar-collapse" id="sidebar-menu">
      <ul class="navbar-nav pt-lg-3">
        <li class="nav-item">
          <a
            class="nav-link{% if request.resolver_match.url_name == 'inicio' %} active{% endif %}"
            href="{% url 'inicio' %}"
            {% if request.resolver_match.url_name == 'inicio' %}aria-current="page"{% endif %}
          >
            <span class="nav-link-icon">
              <i class="ti ti-layout-dashboard" aria-hidden="true"></i>
            </span>
            <span class="nav-link-title">Dashboard</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.resolver_match.namespace == 'clientes' %} active{% endif %}"
            href="{% url 'clientes:lista' %}"
            {% if request.resolver_match.namespace == 'clientes' %}aria-current="page"{% endif %}
          >
            <span class="nav-link-icon">
              <i class="ti ti-users" aria-hidden="true"></i>
            </span>
            <span class="nav-link-title">Clientas</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.resolver_match.namespace == 'reservas' %} active{% endif %}"
            href="{% url 'reservas:lista' %}"
            {% if request.resolver_match.namespace == 'reservas' %}aria-current="page"{% endif %}
          >
            <span class="nav-link-icon">
              <i class="ti ti-calendar" aria-hidden="true"></i>
            </span>
            <span class="nav-link-title">Reservas</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.resolver_match.namespace == 'atenciones' %} active{% endif %}"
            href="{% url 'atenciones:lista' %}"
            {% if request.resolver_match.namespace == 'atenciones' %}aria-current="page"{% endif %}
          >
            <span class="nav-link-icon">
              <i class="ti ti-clipboard-check" aria-hidden="true"></i>
            </span>
            <span class="nav-link-title">Atenciones</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.resolver_match.namespace == 'profesionales' %} active{% endif %}"
            href="{% url 'profesionales:lista' %}"
            {% if request.resolver_match.namespace == 'profesionales' %}aria-current="page"{% endif %}
          >
            <span class="nav-link-icon">
              <i class="ti ti-user-heart" aria-hidden="true"></i>
            </span>
            <span class="nav-link-title">Profesionales</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link{% if request.resolver_match.namespace == 'servicios' %} active{% endif %}"
            href="{% url 'servicios:lista' %}"
            {% if request.resolver_match.namespace == 'servicios' %}aria-current="page"{% endif %}
          >
            <span class="nav-link-icon">
              <i class="ti ti-brush" aria-hidden="true"></i>
            </span>
            <span class="nav-link-title">Servicios</span>
          </a>
        </li>
      </ul>
    </div>
  </div>
</aside>
