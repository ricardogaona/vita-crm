<header class="navbar d-print-none">
  <div class="container-xl">
    <div class="navbar-nav flex-fill">
      {% if page_title %}
        <div class="nav-item">
          <span class="nav-link px-0 text-secondary justify-content-start">{{ page_title }}</span>
        </div>
      {% endif %}
    </div>
    <div class="navbar-nav flex-row">
      {% if user.is_authenticated %}
        <div class="nav-item">
          <span class="nav-link">
            <i class="ti ti-user" aria-hidden="true"></i>
            <span class="ms-2">{{ user.get_username }}</span>
          </span>
        </div>
        {% if user.is_staff %}
          <div class="nav-item">
            <a class="nav-link" href="{% url 'admin:index' %}">Administración</a>
          </div>
        {% endif %}
      {% endif %}
    </div>
  </div>
</header>
