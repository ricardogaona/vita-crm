<div class="mb-3">
  {% if field.widget_type == "checkbox" %}
    <label class="form-check" for="{{ field.id_for_label }}">
      {{ field }}
      <span class="form-check-label">
        {{ field.label }}
        {% if field.field.required %}
          <span class="visually-hidden"> (obligatorio)</span>
        {% endif %}
      </span>
    </label>
  {% else %}
    <label class="form-label" for="{{ field.id_for_label }}">
      {{ field.label }}
      {% if field.field.required %}
        <span class="text-danger" aria-hidden="true">*</span>
        <span class="visually-hidden"> (obligatorio)</span>
      {% endif %}
    </label>
    {{ field }}
  {% endif %}
  {% if field.help_text %}
    <div class="form-hint" id="{{ field.id_for_label }}-help">{{ field.help_text }}</div>
  {% endif %}
  {% if field.errors %}
    <div class="invalid-feedback d-block" id="{{ field.id_for_label }}-error">
      {% for error in field.errors %}
        <div>{{ error }}</div>
      {% endfor %}
    </div>
  {% endif %}
</div>
