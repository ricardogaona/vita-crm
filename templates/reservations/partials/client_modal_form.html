{% if form.non_field_errors %}
  <div class="alert alert-danger" role="alert">
    {% for error in form.non_field_errors %}
      <div>{{ error }}</div>
    {% endfor %}
  </div>
{% endif %}
<form
  method="post"
  action="{% url 'reservas:clienta_nueva' %}"
  novalidate
  hx-post="{% url 'reservas:clienta_nueva' %}"
  hx-target="#new-client-modal-body"
  hx-swap="innerHTML"
  hx-on:close-new-client-modal="var modalEl = document.getElementById('new-client-modal'); var api = window.tabler && window.tabler.bootstrap; var modal = api && api.Modal && api.Modal.getInstance(modalEl); if (!modal) return; window.setTimeout(function () { function hide() { modalEl.addEventListener('hidden.bs.modal', function () { var body = document.getElementById('new-client-modal-body'); if (body) body.replaceChildren(); }, { once: true }); modal.hide(); var active = document.activeElement; if (active && modalEl.contains(active) && active.blur) active.blur(); } if (!modal._isTransitioning) { hide(); return; } function afterTransition() { modalEl.removeEventListener('shown.bs.modal', afterTransition); modalEl.removeEventListener('hidden.bs.modal', afterTransition); if (modal._isShown) hide(); } modalEl.addEventListener('shown.bs.modal', afterTransition); modalEl.addEventListener('hidden.bs.modal', afterTransition); }, 0);"
>
  {% csrf_token %}
  {% for field in form %}
    {% include "components/form_field.html" with field=field %}
  {% endfor %}
  <div class="d-flex gap-2">
    <button type="submit" class="btn btn-primary">Guardar clienta</button>
    <button type="button" class="btn" data-bs-dismiss="modal">Cancelar</button>
  </div>
</form>
