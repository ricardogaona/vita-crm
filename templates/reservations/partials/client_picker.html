<div id="reservation-client-picker"{% if oob %} hx-swap-oob="outerHTML"{% endif %}>
  <label class="form-label" for="id_client_search">
    Clienta
    <span class="text-danger" aria-hidden="true">*</span>
    <span class="visually-hidden"> (obligatorio)</span>
  </label>
  <div class="row g-2 align-items-start">
    <div class="col picker-field">
      <div class="picker-control position-relative">
        <input
          type="text"
          id="id_client_search"
          name="q"
          class="form-control pe-5"
          placeholder="Nombre, apellido, teléfono o documento"
          autocomplete="off"
          aria-label="Buscar clienta"
          {% if selected_client %}readonly value="{{ selected_client }}"{% endif %}
          hx-get="{% url 'reservas:clientas_buscar' %}"
          hx-trigger="keyup changed delay:300ms"
          hx-target="#client-search-results"
          hx-on:keydown="if (event.key === 'Enter') event.preventDefault()"
        >
        <button
          type="button"
          class="picker-clear position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent text-secondary lh-1 p-2"
          data-picker-clear
          data-picker-hidden="id_client"
          data-picker-search="id_client_search"
          data-picker-results="client-search-results"
          aria-label="Quitar clienta"
          {% if not selected_client %}hidden{% endif %}
        >
          <i class="ti ti-x" aria-hidden="true"></i>
        </button>
      </div>
      <div id="client-search-results" class="mt-2"></div>
    </div>
    <div class="col-auto">
      <button
        type="button"
        class="btn"
        hx-get="{% url 'reservas:clienta_nueva' %}"
        hx-target="#new-client-modal-body"
        hx-swap="innerHTML"
        data-bs-toggle="modal"
        data-bs-target="#new-client-modal"
      >
        + Nueva clienta
      </button>
    </div>
  </div>
  <input type="hidden" name="client" id="id_client" value="{% if selected_client %}{{ selected_client.pk }}{% elif client_value %}{{ client_value }}{% endif %}">
  {% if form %}
    {% if form.client.errors %}
      <div class="invalid-feedback d-block" id="id_client-error">
        {% for error in form.client.errors %}
          <div>{{ error }}</div>
        {% endfor %}
      </div>
    {% endif %}
  {% endif %}
</div>
