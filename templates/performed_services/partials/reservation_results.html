{% if query %}
  {% if reservations %}
    <div class="list-group">
      {% for reservation in reservations %}
        <button
          type="button"
          class="list-group-item list-group-item-action"
          hx-get="{% url 'atenciones:reserva_seleccionar' reservation.pk %}{% if current_reservation_id %}?actual={{ current_reservation_id }}{% endif %}"
          hx-target="#attention-reservation-picker"
          hx-swap="outerHTML"
        >
          RES-{{ reservation.pk|stringformat:"04d" }} · {{ reservation.client }}
          {% if reservation.client.identification_number %}
            <span class="text-secondary"> · {{ reservation.client.identification_number }}</span>
          {% endif %}
        </button>
      {% endfor %}
    </div>
  {% else %}
    <div class="text-secondary">No hay reservas disponibles que coincidan.</div>
  {% endif %}
{% endif %}
